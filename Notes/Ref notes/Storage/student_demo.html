    <script>
        const markdownData = {"ebs-quick-ref-card.md": "# ebs quick ref card\n\n## Installation Prerequisites\n\n```bash\n# Ubuntu/Debian\nsudo apt-get update && sudo apt-get install -y cloud-guest-utils awscli jq\n\n# CentOS/RHEL  \nsudo yum install -y cloud-utils-growpart awscli jq\n\n# Verify AWS CLI\naws --version\nwhich growpart\n```\n\n***\n\n## Complete Workflow at a Glance\n\n{% stepper %}\n{% step %}\n### CREATE (AWS)\n\naws ec2 create-volume\n{% endstep %}\n\n{% step %}\n### ATTACH (AWS)\n\naws ec2 attach-volume\n{% endstep %}\n\n{% step %}\n### FORMAT (Linux)\n\nsudo mkfs.ext4 /dev/xvdf\n{% endstep %}\n\n{% step %}\n### MOUNT (Linux)\n\nsudo mount /dev/xvdf /mnt/data\n{% endstep %}\n\n{% step %}\n### AUTOBOOT (fstab)\n\necho UUID=... >> /etc/fstab\n{% endstep %}\n\n{% step %}\n### RESIZE (all 3)\n\nmodify-volume \u2192 growpart \u2192 resize2fs\n{% endstep %}\n\n{% step %}\n### RECOVER (detach)\n\ndetach \u2192 attach to new instance\n{% endstep %}\n{% endstepper %}\n\n***\n\n## AWS CLI Commands Cheatsheet\n\n| Task               | Command                                                                            |\n| ------------------ | ---------------------------------------------------------------------------------- |\n| Create 10GB volume | `aws ec2 create-volume --size 10 --volume-type gp3 --availability-zone us-east-1a` |\n| List volumes       | `aws ec2 describe-volumes --output table`                                          |\n| Attach volume      | `aws ec2 attach-volume --volume-id vol-xxx --instance-id i-xxx --device /dev/sdf`  |\n| Modify size        | `aws ec2 modify-volume --volume-id vol-xxx --size 20`                              |\n| Check modification | `aws ec2 describe-volumes-modifications --volume-ids vol-xxx`                      |\n| Detach volume      | `aws ec2 detach-volume --volume-id vol-xxx`                                        |\n| Take snapshot      | `aws ec2 create-snapshot --volume-id vol-xxx --description \"backup\"`               |\n\n***\n\n## Linux Commands Cheatsheet\n\n| Task           | ext4                             | xfs                              |\n| -------------- | -------------------------------- | -------------------------------- |\n| Check type     | `df -T`                          | `df -T`                          |\n| List devices   | `lsblk`                          | `lsblk`                          |\n| Create FS      | `sudo mkfs.ext4 /dev/xvdf`       | `sudo mkfs.xfs /dev/xvdf`        |\n| Mount          | `sudo mount /dev/xvdf /mnt/data` | `sudo mount /dev/xvdf /mnt/data` |\n| Get UUID       | `sudo blkid /dev/xvdf`           | `sudo blkid /dev/xvdf`           |\n| Unmount        | `sudo umount /mnt/data`          | `sudo umount /mnt/data`          |\n| Grow partition | `sudo growpart /dev/xvdf 1`      | `sudo growpart /dev/xvdf 1`      |\n| Expand FS      | `sudo resize2fs /dev/xvdf1`      | `sudo xfs_growfs /mnt/data`      |\n| Check space    | `df -h`                          | `df -h`                          |\n\n***\n\n## fstab Configuration Template\n\n```bash\n# Pattern: UUID=<uuid> <mount-point> <type> <options> <dump> <pass>\n\n# Example for ext4\nUUID=a1b2c3d4-e5f6-7890-abcd-ef1234567890 /mnt/data ext4 defaults,nofail 0 0\n\n# Example for XFS  \nUUID=a1b2c3d4-e5f6-7890-abcd-ef1234567890 /mnt/data xfs defaults,nofail 0 0\n\n# Options explained:\n\n# defaults    = standard mount options\n# nofail      = don't fail boot if volume missing\n# 0           = dump flag (0 = disabled)\n# 0           = fsck pass (0 = skip)\n```\n\n***\n\n## The Three-Layer Expansion (Critical!)\n\n{% stepper %}\n{% step %}\n### Layer 1: AWS Console/CLI\n\naws ec2 modify-volume --size 20\n\nStatus: creating \u2192 modifying \u2192 optimizing \u2192 completed\n{% endstep %}\n\n{% step %}\n### Layer 2: Linux Partition\n\nsudo growpart /dev/xvda 1\n\nExpands partition table to fill disk\n{% endstep %}\n\n{% step %}\n### Layer 3: Linux Filesystem\n\next4: sudo resize2fs /dev/xvda1\\\nxfs: sudo xfs\\_growfs /\n\nExpands filesystem to fill partition\n{% endstep %}\n\n{% step %}\n### Verify\n\ndf -h | lsblk\n{% endstep %}\n{% endstepper %}\n\n***\n\n## Common Commands During Demo\n\n### Exercise 1: Create & Attach\n\n```bash\n# Get AZ\naws ec2 describe-instances --instance-ids i-xxx \\\n  --query 'Reservations[0].Instances[0].Placement.AvailabilityZone'\n\n# Create volume\naws ec2 create-volume --size 10 --volume-type gp3 \\\n  --availability-zone us-east-1a\n\n# Attach volume  \naws ec2 attach-volume --volume-id vol-xxx --instance-id i-xxx \\\n  --device /dev/sdf\n\n# In instance:\nlsblk\nsudo mkfs.ext4 /dev/xvdf\nsudo mount /dev/xvdf /mnt/data\ndf -h\n```\n\n### Exercise 2: Resize (No Downtime!)\n\n```bash\n# Snapshot first!\naws ec2 create-snapshot --volume-id vol-xxx \\\n  --description \"backup\"\n\n# Modify size (instance stays running!)\naws ec2 modify-volume --volume-id vol-xxx --size 20\n\n# Wait for completion\naws ec2 describe-volumes-modifications --volume-ids vol-xxx\n\n# In instance:\nlsblk\nsudo growpart /dev/xvdf 1\nsudo resize2fs /dev/xvdf1  # or xfs_growfs /mnt/data\ndf -h\n```\n\n### Exercise 4: fstab Setup\n\n```bash\n# Get UUID\nsudo blkid /dev/xvdf\n\n# Backup fstab (CRITICAL!)\nsudo cp /etc/fstab /etc/fstab.backup\n\n# Add to fstab\necho \"UUID=xxx /mnt/data ext4 defaults,nofail 0 0\" | \\\n  sudo tee -a /etc/fstab\n\n# Test (BEFORE REBOOT!)\nsudo mount -a\n\n# Verify\ndf -h\nsudo reboot\ndf -h  # after reboot\n```\n\n### Exercise 5: Disaster Recovery\n\n```bash\n# On source instance:\nsudo umount /mnt/data\n\n# Detach\naws ec2 detach-volume --volume-id vol-xxx\n\n# Wait for available\naws ec2 describe-volumes --volume-ids vol-xxx\n\n# Attach to new instance\naws ec2 attach-volume --volume-id vol-xxx --instance-id i-new \\\n  --device /dev/sdf\n\n# On new instance:\nsudo mkdir -p /mnt/recovered\nsudo mount /dev/xvdf /mnt/recovered\nls /mnt/recovered  # Your data is here!\n```\n\n***\n\n## Decision Tree: Which Tool to Use?\n\nDo you need to expand something?\n\n* \"AWS Console\" \u2192 Volume Size\\\n  Command: aws ec2 modify-volume\n* \"Partition\" \u2192 Device space showing less than disk\\\n  Command: sudo growpart /dev/xvda 1\n* \"Filesystem\" \u2192 Mounted space showing old size\n  * ext4? \u2192 sudo resize2fs /dev/xvda1\n  * xfs? \u2192 sudo xfs\\_growfs /\n\n***\n\n## Troubleshooting Quick Fixes\n\n| Problem             | Check            | Fix                                  |\n| ------------------- | ---------------- | ------------------------------------ |\n| Volume won't attach | Same AZ?         | Use snapshot to create in correct AZ |\n| growpart: NOCHANGE  | Modify complete? | Wait for AWS modification            |\n| resize2fs: busy     | Mounted?         | Run on mounted fs - that's OK        |\n| fstab boot fail     | Syntax OK?       | Boot from recovery instance, fix     |\n| Volume shows small  | Check type       | Device (xvdf) vs Partition (xvdf1)   |\n\n***\n\n## Success Checklist After Each Exercise\n\n### Exercise 1: \u2713 Volume Created & Mounted\n\n* [ ] `aws ec2 describe-volumes` shows volume in-use\n* [ ] `lsblk` shows device in instance\n* [ ] `df -h` shows mount point\n* [ ] Can read/write files to mount\n\n### Exercise 2: \u2713 Resized Without Downtime\n\n* [ ] Instance stayed running (ping never failed)\n* [ ] `lsblk` shows new partition size\n* [ ] `df -h` shows new filesystem size\n* [ ] Data is still accessible\n\n### Exercise 3: \u2713 New Instance Ready\n\n* [ ] New instance running\n* [ ] New volume attached\n* [ ] Volume mounted and formatted\n* [ ] Can access empty volume\n\n### Exercise 4: \u2713 Auto-Mount Configured\n\n* [ ] fstab backup exists\n* [ ] fstab entry is correct\n* [ ] `sudo mount -a` succeeds\n* [ ] Volume mounts after reboot\n\n### Exercise 5: \u2713 Data Recovered\n\n* [ ] Volume detached from source\n* [ ] Volume attached to target\n* [ ] Data is accessible on target\n* [ ] No data loss during transfer\n\n### Exercise 6: \u2713 Full Expansion Mastered\n\n* [ ] All 3 layers understood\n* [ ] Knows when to use each command\n* [ ] Can troubleshoot each layer\n* [ ] Can explain to someone else\n\n***\n\n## Post-Demo Student Assessment\n\nAsk each student:\n\n1. \"Create a volume and attach to an instance in the same AZ.\"\n   * Expected: Uses aws ec2 create-volume + attach-volume\n2. \"Your filesystem is at 95% capacity. Walk me through expansion.\"\n   * Expected: modify-volume \u2192 growpart \u2192 resize2fs/xfs\\_growfs\n3. \"Add a volume to fstab for permanent mount. What's critical?\"\n   * Expected: Mentions blkid, backup, mount -a test, nofail option\n4. \"Instance crashed. How do you recover data?\"\n   * Expected: umount \u2192 detach \u2192 attach to rescue \u2192 mount\n5. \"Difference between ext4 (resize2fs) and XFS (xfs\\_growfs)?\"\n   * Expected: Different filesystems, different expansion tools\n\nAll 5 correct = Passed! Student is ready for production work.\n\n***\n\n## Real-World Scenarios They'll Face\n\n| Scenario                        | Solution                          |\n| ------------------------------- | --------------------------------- |\n| App running out of space        | Exercise 2 workflow (resize live) |\n| New microservice needs storage  | Exercise 3 workflow               |\n| Instance crashed, data lost?    | Exercise 5 workflow               |\n| Volume won't mount after reboot | Exercise 4 fix (fstab)            |\n| DB needs high performance       | Use io1/io2 volumes               |\n| Multi-AZ setup                  | Snapshot + restore                |\n| Disaster recovery plan          | All exercises combined            |\n\n***\n\n## Links & Resources\n\n* [AWS EBS User Guide](https://docs.aws.amazon.com/ebs/)\n* [Linux mkfs Documentation](https://linux.die.net/man/8/mkfs)\n* [fstab Man Page](https://linux.die.net/man/5/fstab)\n* [growpart Tool](https://linux.die.net/man/8/growpart)\n\n***\n\nPrint this card and keep it on your desk during demos!\n\nCreated for: Live DevOps Training | Time to master: 70 minutes | Exercises: 6\n", "ebs-demo-reference.md": "# ebs demo reference\n\n## Exercise Summary Overview\n\n| Exercise | Scenario                  | Duration | Key Commands                                   | Outcome                        |\n| -------- | ------------------------- | -------- | ---------------------------------------------- | ------------------------------ |\n| 1        | Create & Attach Volume    | 10 min   | create-volume, attach-volume, mkfs, mount      | Volume available for use       |\n| 2        | Resize Without Downtime   | 15 min   | modify-volume, growpart, resize2fs/xfs\\_growfs | Increased storage live         |\n| 3        | New Volume + New Instance | 12 min   | run-instances, create-volume, attach-volume    | Ready-to-use new setup         |\n| 4        | Add to fstab              | 8 min    | blkid, echo >> fstab, mount -a                 | Auto-mount on reboot           |\n| 5        | Detach & Re-attach        | 10 min   | umount, detach-volume, attach-volume           | Data recovered on new instance |\n| 6        | Partition & FS Expansion  | 12 min   | growpart, resize2fs/xfs\\_growfs                | Full disk utilization          |\n\n**Total Lab Time: \\~60-70 minutes**\n\n***\n\n## Dependency Flow\n\n```\nExercise 1: Create & Attach\n    \u2193\nExercise 2: Resize (using volume from Ex 1)\n    \u2193\nExercise 3: New Instance + New Volume\n    \u2193\nExercise 4: Add to fstab (using volume from Ex 3)\n    \u2193\nExercise 5: Detach from Ex 1, Reattach to new instance\n    \u2193\nExercise 6: Full partition/filesystem expansion demo\n```\n\n***\n\n## Pre-Demo Checklist\n\n* [ ] 3 EC2 instances running (t2.micro or t2.small)\n* [ ] AWS CLI configured with proper credentials\n* [ ] SSH keys accessible\n* [ ] Security groups allow inbound on port 22 (SSH)\n* [ ] Test instances are in same AZ\n* [ ] Student accounts have EC2 permissions\n* [ ] Terminal/Console ready for live commands\n* [ ] AWS Console open in browser for parallel view\n\n***\n\n## Single-Command Execution Sequences\n\n### Quick Setup (if starting fresh)\n\n```bash\n# Create 3 test instances in us-east-1a\nfor i in {1..3}; do\n  aws ec2 run-instances \\\n    --image-id ami-0c55b159cbfafe1f0 \\\n    --instance-type t2.micro \\\n    --availability-zone us-east-1a \\\n    --key-name your-key \\\n    --security-groups default \\\n    --tag-specifications \"ResourceType=instance,Tags=[{Key=Name,Value=demo-instance-$i}]\"\ndone\n\n# Wait for instances to run (30-60 seconds)\nsleep 60\n\n# Get instance IDs and IPs\naws ec2 describe-instances \\\n  --filters 'Name=tag:Name,Values=demo-instance-*' \\\n  'Name=instance-state-name,Values=running' \\\n  --query 'Reservations[].Instances[].[InstanceId,PublicIpAddress,Tags[0].Value]' \\\n  --output table\n```\n\n### Exercise 1: Complete Flow\n\n```bash\n# Variables\nINSTANCE_ID=\"i-0123456789abcdef0\"\nAZ=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID \\\n  --query 'Reservations[0].Instances[0].Placement.AvailabilityZone' --output text)\n\n# Create volume\nVOL_ID=$(aws ec2 create-volume --size 10 --volume-type gp3 \\\n  --availability-zone $AZ \\\n  --tag-specifications 'ResourceType=volume,Tags=[{Key=Name,Value=ex1-volume}]' \\\n  --query 'VolumeId' --output text)\n\necho \"Volume created: $VOL_ID\"\n\n# Wait for available\nwhile [ \"$(aws ec2 describe-volumes --volume-ids $VOL_ID \\\n  --query 'Volumes[0].State' --output text)\" != \"available\" ]; do\n  echo \"Waiting for volume...\"\n  sleep 5\ndone\n\n# Attach\naws ec2 attach-volume --volume-id $VOL_ID --instance-id $INSTANCE_ID --device /dev/sdf\necho \"Volume attached. Getting instance IP...\"\n\n# Get IP\nINSTANCE_IP=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID \\\n  --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)\n\necho \"SSH into instance: ssh -i your-key.pem ec2-user@$INSTANCE_IP\"\necho \"Then run:\"\necho \"  sudo mkdir -p /mnt/data-volume\"\necho \"  sudo mkfs.ext4 /dev/xvdf\"\necho \"  sudo mount /dev/xvdf /mnt/data-volume\"\necho \"  df -h | grep data-volume\"\n```\n\n### Exercise 2: Quick Resize\n\n```bash\nVOLUME_ID=\"vol-0abcdef1234567890\"\nINSTANCE_IP=\"1.2.3.4\"\n\n# Take snapshot\nSNAPSHOT=$(aws ec2 create-snapshot --volume-id $VOLUME_ID \\\n  --description \"Backup before resize\" --query 'SnapshotId' --output text)\n\necho \"Snapshot created: $SNAPSHOT\"\n\n# Modify volume (10GB \u2192 20GB)\naws ec2 modify-volume --volume-id $VOLUME_ID --size 20\n\n# Monitor\necho \"Monitoring volume modification...\"\nwhile [ \"$(aws ec2 describe-volumes-modifications --volume-ids $VOLUME_ID \\\n  --query 'VolumesModifications[0].ModificationState' --output text)\" != \"completed\" ]; do\n  echo \"State: $(aws ec2 describe-volumes-modifications --volume-ids $VOLUME_ID \\\n  --query 'VolumesModifications[0].ModificationState' --output text)\"\n  sleep 10\ndone\n\necho \"Volume modification complete!\"\n\n# SSH commands for instance\necho \"\"\necho \"SSH into instance: ssh -i your-key.pem ec2-user@$INSTANCE_IP\"\necho \"Then run:\"\necho \"  sudo growpart /dev/xvdf 1\"\necho \"  sudo resize2fs /dev/xvdf1\"\necho \"  df -h\"\n```\n\n***\n\n## Live Demo Flow Script\n\n### Opening Statement (2 minutes)\n\n\"Today we're going to explore AWS EBS volumes - the persistent storage behind EC2 instances. We'll start with the basics of creating and attaching volumes, then move to real-world scenarios like resizing without downtime and recovering data from crashed instances. By the end, you'll understand the complete lifecycle of EBS volume management.\"\n\n{% stepper %}\n{% step %}\n### Exercise 1 (10 min)\n\n\"Imagine you just launched an EC2 instance for a new application. The instance has 8GB of root storage, but your app needs 10GB more for data. Let me show you how to create that volume, attach it, and make it available to the application.\"\n{% endstep %}\n\n{% step %}\n### Exercise 2 (15 min)\n\n\"Your application is growing! You initially created a 10GB volume, but now you're at 90% capacity at 3 AM on a Sunday. Fortunately, AWS lets you resize volumes without stopping the instance. Watch how we do this without any downtime.\"\n{% endstep %}\n\n{% step %}\n### Exercise 3 (12 min)\n\n\"Now you're deploying a new microservice. Instead of manually creating volumes, you can script it. Let me show you how to launch a new instance and attach a volume in one workflow - this is how you do infrastructure as code.\"\n{% endstep %}\n\n{% step %}\n### Exercise 4 (8 min)\n\n\"Here's a critical point - if you don't add the volume to fstab, it won't automatically mount after a reboot. Let me show you how to configure that. This has saved me from many 3 AM incidents!\"\n{% endstep %}\n\n{% step %}\n### Exercise 5 (10 min)\n\n\"Worst case scenario: an instance crashes. But your data is on the EBS volume. Let me show you how to detach that volume and attach it to a recovery instance to access your data. This is a critical skill for troubleshooting.\"\n{% endstep %}\n\n{% step %}\n### Exercise 6 (12 min)\n\n\"Finally, let's talk about the details of partition and filesystem expansion. This is where most people get confused with growpart, resize2fs, and xfs\\_growfs. I'll show you when to use each command.\"\n{% endstep %}\n{% endstepper %}\n\n***\n\n## Common Student Questions & Answers\n\n<details>\n\n<summary>Q: Why do I need different commands for ext4 (resize2fs) and XFS (xfs_growfs)?</summary>\n\nA: They're different filesystems with different structures. ext4 uses extent trees, XFS uses B+ trees. Each needs its own tool to expand safely.\n\n</details>\n\n<details>\n\n<summary>Q: If I reboot before adding to fstab, what happens?</summary>\n\nA: The volume stays attached but unmounts. Your app might crash looking for that data. That's why fstab is critical.\n\n</details>\n\n<details>\n\n<summary>Q: Can I resize a volume while the instance is running?</summary>\n\nA: Yes! Volume resizing is online. But you can't extend the partition/filesystem while mounted on older kernels. Modern kernels support this too.\n\n</details>\n\n<details>\n\n<summary>Q: What's the difference between backing up and snapshots?</summary>\n\nA: A snapshot is AWS's backup mechanism - point-in-time copies of your volume. You should always take one before major operations.\n\n</details>\n\n<details>\n\n<summary>Q: If I attach the same volume to two instances, can both access the data?</summary>\n\nA: No! EBS volumes can only be attached to ONE instance at a time (unless using Multi-Attach, which is rare). This is a common gotcha.\n\n</details>\n\n<details>\n\n<summary>Q: Why must the volume and instance be in the same AZ?</summary>\n\nA: AWS Availability Zones have different physical infrastructure. You can't connect to an AZ you're not in without going through snapshots.\n\n</details>\n\n***\n\n## Troubleshooting\n\nStudent Problem: \"My growpart didn't work\"\n\n* Check: `lsblk` - does the partition size match disk size?\n* Check: `aws ec2 describe-volumes-modifications` - is volume still modifying?\n* Solution: Wait 2-3 more minutes for AWS optimization\n\nStudent Problem: \"fstab broke my instance\"\n\n* This is a teaching moment! Show recovery:\n  * Stop instance\n  * Detach root volume\n  * Attach to another instance\n  * Mount and fix fstab\n  * Reattach\n  * Show they're not alone in this mistake!\n\nStudent Problem: \"Volume showed 20GB before, now 10GB\"\n\n* Likely: `lsblk` shows disk, but they're looking at partition\n* Show: `lsblk` output interpretation\n* Highlight: Device naming (xvda vs xvda1)\n\n***\n\n## Post-Demo Activities\n\n### Homework Assignments\n\n{% stepper %}\n{% step %}\nCreate a volume, attach to instance, add to fstab, verify reboot\n{% endstep %}\n\n{% step %}\nI'll give you a broken instance, fix the fstab\n{% endstep %}\n\n{% step %}\n\"Your root partition is 95% full - resize it\"\n{% endstep %}\n\n{% step %}\nExplain the three-step expansion process (vol \u2192 partition \u2192 fs)\n{% endstep %}\n{% endstepper %}\n\n### Real-World Exercises\n\n{% stepper %}\n{% step %}\nCreate a backup volume, take snapshots\n{% endstep %}\n\n{% step %}\nSet up an automated backup system\n{% endstep %}\n\n{% step %}\nTest disaster recovery (detach and reattach)\n{% endstep %}\n\n{% step %}\nMonitor volume performance (IOPS/throughput)\n{% endstep %}\n{% endstepper %}\n\n***\n\n## Key Metrics for Success\n\nBy end of demo, students should:\n\n* [ ] Understand EBS volume lifecycle (create \u2192 attach \u2192 mount \u2192 use)\n* [ ] Know the three-layer expansion: AWS volume \u2192 Partition \u2192 Filesystem\n* [ ] Distinguish between ext4 (resize2fs) and XFS (xfs\\_growfs)\n* [ ] Explain why fstab is critical for production systems\n* [ ] Demonstrate disaster recovery scenario\n* [ ] Understand AZ constraints and cross-AZ limitations\n* [ ] Know how to safely test fstab changes (mount -a)\n* [ ] Recognize common mistakes and how to recover\n\n***\n\n## Resource References\n\n### AWS Documentation\n\n* https://docs.aws.amazon.com/ebs/latest/userguide/ebs-using-volumes.html\n* https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-describe-volumes.html\n\n### Linux Tools\n\n* `growpart` - Partition expansion (cloud-utils-growpart)\n* `resize2fs` - ext4 filesystem expansion\n* `xfs_growfs` - XFS filesystem expansion\n* `/etc/fstab` - Filesystem mount table\n\n### Monitoring\n\n* `lsblk` - List block devices\n* `df -h` - Disk usage (human-readable)\n* `df -T` - Disk usage with filesystem type\n* `mount` - Show mounted filesystems\n\n***\n\n## Demo Environment Checklist\n\nBefore starting:\n\n```bash\n# Verify all instances running\naws ec2 describe-instances \\\n  --filters 'Name=instance-state-name,Values=running' \\\n  --query 'Reservations[].Instances[].[InstanceId,PublicIpAddress]'\n\n# Verify AWS CLI is configured\naws sts get-caller-identity\n\n# Check internet connectivity\ncurl -I https://aws.amazon.com\n\n# Test SSH access (before demo)\nssh -i your-key.pem ec2-user@instance-ip \"uname -a\"\n```\n\n***\n\n## Estimated Time Breakdown\n\n| Phase        | Duration      | Activity                              |\n| ------------ | ------------- | ------------------------------------- |\n| Setup        | 5 min         | Launch instances, verify connectivity |\n| Exercise 1-3 | 30 min        | Create, attach, and manage volumes    |\n| Exercise 4-5 | 18 min        | fstab configuration and recovery      |\n| Exercise 6   | 12 min        | Deep dive into partition/fs expansion |\n| Q\\&A         | 5-10 min      | Student questions                     |\n| **Total**    | **70-75 min** | Complete hands-on session             |\n\n***\n\n## Pro Tips for Delivery\n\n1. Use Variables: Store IDs in bash variables so students see the automation\n2. Show Errors: Don't skip mistakes - they're learning opportunities\n3. Narrate Everything: Explain the \"why\" not just the \"how\"\n4. Use AWS Console + CLI: Show parallel views for context\n5. Pause for Questions: Don't rush through - learning is not linear\n6. Save Terminal Output: Students can refer back to it\n7. Encourage Lab Notes: Ask students to document their own commands\n8. Real Scenario Names: Name volumes \"prod-db-volume\" not \"vol-123\" - makes it memorable\n", "README.md": "# I want to demonstarte the excercises on EBS volume\n\nBelow are clear, executable steps and commands for each demo scenario you requested. Assume:\n\n* You have AWS CLI configured with required IAM permissions.\n* You have an EC2 instance running Linux (replace instance IDs, device names, region, availability zone, volume IDs, and sizes with your real values).\n* Commands run as root or with sudo where needed.\n\nUse the stepper format for each exercise.\n\n{% stepper %}\n{% step %}\n### Exercise: Create a new volume and attach it to an EC2 instance\n\n1. Create a new EBS volume (example: 10 GiB, gp3, same AZ as instance)\n\n```bash\naws ec2 create-volume \\\n  --availability-zone us-east-1a \\\n  --size 10 \\\n  --volume-type gp3 \\\n  --tag-specifications 'ResourceType=volume,Tags=[{Key=Name,Value=demo-volume-1}]'\n```\n\nNote the VolumeId from the output (e.g., vol-0123456789abcdef0).\n\n2. Attach the volume to an EC2 instance (example device /dev/sdf)\n\n```bash\naws ec2 attach-volume \\\n  --volume-id vol-0123456789abcdef0 \\\n  --instance-id i-0abcdef1234567890 \\\n  --device /dev/sdf\n```\n\n3. On the instance: identify the device (NVMe instances show /dev/nvm&#x65;_&#x6E;_)\n\n```bash\n# List block devices\nlsblk\n\n# On NVMe-based instance map AWS device name to NVMe:\nsudo nvme list\n# or check symlinks:\nls -l /dev/disk/by-id | grep vol-0123456789abcdef0\n```\n\n4. Create filesystem and mount\n\n```bash\n# Create ext4 filesystem\nsudo mkfs.ext4 /dev/xvdf             # or /dev/nvme1n1 depending on lsblk\n\n# Create mount point and mount\nsudo mkdir -p /mnt/ebs-demo1\nsudo mount /dev/xvdf /mnt/ebs-demo1\n\n# Verify\ndf -h /mnt/ebs-demo1\nlsblk -f\n```\n{% endstep %}\n\n{% step %}\n### Exercise: Increase the attached volume size without downtime (volume remains available)\n\nOverview: Use AWS ModifyVolume to increase EBS volume size. Then, inside the instance, expand the partition (if present) and the filesystem using growpart + resize2fs (ext4) or xfs\\_growfs (XFS).\n\n1. Modify EBS volume (example: increase from 10 GiB to 30 GiB)\n\n```bash\naws ec2 modify-volume \\\n  --volume-id vol-0123456789abcdef0 \\\n  --size 30\n```\n\n2. Wait for modification to complete (or use describe to check)\n\n```bash\naws ec2 describe-volumes-modifications --volume-ids vol-0123456789abcdef0\n```\n\n3. On the instance: rescan the block device (Linux kernel should detect size change automatically; on some systems echoing to/sys is needed)\n\n```bash\n# For non-NVMe devices:\nsudo echo 1 > /sys/block/xvd*/device/rescan    # use appropriate device name\n\n# For NVMe devices: trigger rescan with nvme-cli (if nvme)\nsudo apt-get update && sudo apt-get install -y nvme-cli   # if not installed\nsudo nvme rescan\n```\n\n4. If the device has a partition (e.g., /dev/xvdf1), use growpart to expand the partition, then grow the filesystem.\n\nInstall cloud-guest-utils (for growpart) or cloud-utils-growpart if needed:\n\n```bash\n# Debian/Ubuntu\nsudo apt-get install -y cloud-guest-utils\n\n# RHEL/CentOS\nsudo yum install -y cloud-utils-growpart\n```\n\nUse growpart:\n\n```bash\n# Example: expand partition 1 on /dev/xvdf\nsudo growpart /dev/xvdf 1\n```\n\n5. Grow the filesystem:\n\n* For ext4\n\n```bash\nsudo resize2fs /dev/xvdf1\n# Or if filesystem is on the whole disk:\nsudo resize2fs /dev/xvdf\n```\n\n* For XFS\n\n```bash\n# Ensure mount is mounted; xfs_growfs grows a mounted filesystem by mountpoint\nsudo xfs_growfs /mnt/ebs-demo1\n```\n\n6. Verify increased size\n\n```bash\ndf -h /mnt/ebs-demo1\nlsblk\n```\n\nNotes:\n\n* If volume was used as an LVM PV, follow lvextend then resize filesystem (lvextend + resize2fs/xfs\\_growfs).\n* No instance reboot is required for most modern kernels and NVMe devices when resizing a non-root or root filesystem online (but test beforehand).\n{% endstep %}\n\n{% step %}\n### Exercise: Create a new volume and attach it to a new instance\n\n1. Create volume (example 20 GiB)\n\n```bash\naws ec2 create-volume \\\n  --availability-zone us-east-1a \\\n  --size 20 \\\n  --volume-type gp3 \\\n  --tag-specifications 'ResourceType=volume,Tags=[{Key=Name,Value=demo-volume-2}]'\n```\n\n2. Attach to a different EC2 instance\n\n```bash\naws ec2 attach-volume \\\n  --volume-id vol-0abcdef1234567890 \\\n  --instance-id i-0fedcba9876543210 \\\n  --device /dev/sdg\n```\n\n3. On the new instance: identify device, create filesystem and mount\n\n```bash\nsudo lsblk\nsudo mkfs.ext4 /dev/xvdg\nsudo mkdir -p /mnt/ebs-demo2\nsudo mount /dev/xvdg /mnt/ebs-demo2\ndf -h /mnt/ebs-demo2\n```\n{% endstep %}\n\n{% step %}\n### Exercise: Add the volume to /etc/fstab for automatic mount\n\nBest practice: use filesystem UUID. Steps below assume ext4 and device /dev/xvdf1.\n\n1. Get UUID\n\n```bash\nsudo blkid /dev/xvdf1\n# Example output: /dev/xvdf1: UUID=\"abcd-1234\" TYPE=\"ext4\"\n```\n\n2. Backup fstab\n\n```bash\nsudo cp /etc/fstab /etc/fstab.bak\n```\n\n3. Add entry to /etc/fstab using UUID (replace with real UUID and mount point)\n\n```\nUUID=abcd-1234  /mnt/ebs-demo1  ext4  defaults,nofail  0  2\n```\n\n* nofail ensures boot continues if the volume is missing.\n* For XFS use type xfs and appropriate options.\n\n4. Test the fstab entry without reboot\n\n```bash\nsudo umount /mnt/ebs-demo1\nsudo mount -a\n# Verify\nmount | grep /mnt/ebs-demo1\ndf -h /mnt/ebs-demo1\n```\n\nIf mount -a fails, restore /etc/fstab.bak:\n\n```bash\nsudo cp /etc/fstab.bak /etc/fstab\n```\n{% endstep %}\n\n{% step %}\n### Exercise: Unmount a volume and attach it to another instance (DR / data recovery scenario)\n\n1. On instance A: unmount cleanly and detach volume\n\n```bash\n# Unmount\nsudo umount /mnt/ebs-demo1\n\n# Optional: ensure data flushed\nsudo sync\n\n# Detach via AWS CLI\naws ec2 detach-volume --volume-id vol-0123456789abcdef0\n```\n\nWait until state is \"available\":\n\n```bash\naws ec2 describe-volumes --volume-ids vol-0123456789abcdef0 --query \"Volumes[0].State\"\n```\n\n2. Attach to instance B\n\n```bash\naws ec2 attach-volume \\\n  --volume-id vol-0123456789abcdef0 \\\n  --instance-id i-0fedcba9876543210 \\\n  --device /dev/sdf\n```\n\n3. On instance B: discover device, mount using UUID or device path\n\n```bash\n# Find device and filesystem\nsudo lsblk\nsudo blkid\n\n# Mount (example using UUID from blkid)\nsudo mkdir -p /mnt/ebs-recovery\nsudo mount /dev/xvdf1 /mnt/ebs-recovery\nls -l /mnt/ebs-recovery\n```\n\nNotes:\n\n* Ensure file system is clean before mounting; run fsck if needed (unmounted only).\n\n```bash\nsudo fsck -fy /dev/xvdf1\n```\n\n* If the source used LVM, take extra steps to deactivate/activate volume groups on the target.\n{% endstep %}\n\n{% step %}\n### Exercise: growpart, growfs, resize2fs \u2014 three-layer expansion (volume \u2192 partition \u2192 filesystem)\n\nThis summarizes the commands used to expand the three layers after you increase the EBS size via ModifyVolume.\n\n1. Confirm kernel sees larger block device\n\n```bash\nlsblk\n# Check size shows increased; if not, rescan\nsudo growpart --version || sudo apt-get install -y cloud-guest-utils\n```\n\n2. Expand partition with growpart (example partition 1 on /dev/xvdf)\n\n```bash\nsudo growpart /dev/xvdf 1\n# Output indicates partition resized\nlsblk\n```\n\n3. Expand filesystem\n\n* For ext4:\n\n```bash\nsudo resize2fs /dev/xvdf1\n# Or if filesystem is on the whole device:\nsudo resize2fs /dev/xvdf\n```\n\n* For XFS (must be mounted; specify mountpoint)\n\n```bash\nsudo xfs_growfs /mnt/ebs-demo1\n```\n\n4. Verify final size\n\n```bash\ndf -h /mnt/ebs-demo1\nlsblk -f\n```\n\nExample full sequence after ModifyVolume:\n\n```bash\n# 1. Check device\nlsblk\n\n# 2. Expand partition\nsudo growpart /dev/xvdf 1\n\n# 3. Resize filesystem (ext4)\nsudo resize2fs /dev/xvdf1\n\n# 4. Verify\ndf -h /mnt/ebs-demo1\n```\n\nCaveats:\n\n* If using LVM: pvresize -> lvextend -> resize2fs/xfs\\_growfs.\n* XFS cannot be shrunk; ext4 can be shrunk offline.\n* Root volumes may need extra caution; test in lab before production.\n{% endstep %}\n{% endstepper %}\n\nExpandable: Troubleshooting & Common checks\n\n<details>\n\n<summary>Quick troubleshooting checks</summary>\n\n* If lsblk or df does not show new size: rescan device (nvme rescan or echo to /sys/block/\\*/device/rescan).\n* If growpart fails: ensure partition table supports expansion (GPT/MBR) and that partition is the last on disk.\n* If mount -a fails after adding to /etc/fstab: check for typos, correct UUID, and use nofail for non-critical mounts.\n* If filesystem check required: run fsck on unmounted ext4 volumes: sudo fsck -fy /dev/XXX\n* If attaching volume to another instance and it won\u2019t mount: confirm device name mapping (NVMe instances map differently) and that the filesystem is intact.\n\n</details>\n\nFinal notes:\n\n* Replace placeholder IDs, device names, AZs, and mountpaths with your environment values.\n* Encourage students to perform these steps in a sandbox account and to snapshot volumes before risky operations.\n", "ebs-volumes-demo-__aws-console-only-+-ec2-instan.md": "# EBS Volumes Demo   \\_\\_AWS CONSOLE ONLY + EC2 Instan\n\n## Prerequisites (Console Setup - 5 minutes)\n\n* Open AWS Console \u2192 EC2 Dashboard\n* Launch 3 EC2 instances (same AZ, t2.micro, Amazon Linux 2)\n* Name them: `demo-instance-1`, `demo-instance-2`, `demo-instance-3`\n* Note their AZ (e.g., `us-east-1a`) \u2014 ALL volumes must be in the same AZ\n* SSH access ready to all 3 instances\n\n***\n\n## EXERCISE 1: Create Volume & Attach (Console)\n\nReal Scenario: \"Web app needs 10GB extra storage\"\n\n{% stepper %}\n{% step %}\n#### Console: Create volume\n\n* EC2 Dashboard \u2192 \"Volumes\" (left sidebar)\n* Click \"Create Volume\"\n* Size: 10 GiB | Type: gp3 | AZ: us-east-1a (same as instance)\n* Name: \"webapp-data-vol\"\n* Click \"Create volume\"\n* Wait for Status: \"Available\"\n{% endstep %}\n\n{% step %}\n#### Console: Attach to demo-instance-1\n\n* Select the volume \u2192 Actions \u2192 Attach volume\n* Instance: `demo-instance-1` | Device: `/dev/sdf`\n* Click \"Attach volume\"\n* Status changes: Available \u2192 in-use\n{% endstep %}\n{% endstepper %}\n\nInstance Commands (SSH to demo-instance-1):\n\n{% code title=\"Instance commands\" %}\n```bash\n# Check attached volume\nlsblk\n\n# Shows: xvdf    202:80   0   10G  0 disk  \u2190 NEW VOLUME\n\n# Create mount point\nsudo mkdir /mnt/webapp-data\n\n# Create filesystem (formats the volume)\nsudo mkfs.ext4 /mnt/webapp-data\n\n# Mount it\nsudo mount /dev/xvdf /mnt/webapp-data\n\n# Verify\ndf -h | grep webapp-data\n\n# Shows: /dev/xvdf      9.8G   24K  9.3G   1% /mnt/webapp-data\n\n# Test it\necho \"Web app data\" | sudo tee /mnt/webapp-data/test.txt\ncat /mnt/webapp-data/test.txt\n```\n{% endcode %}\n\n\u2705 Success: Volume mounted and writable\n\n***\n\n## EXERCISE 2: Resize Volume (NO DOWNTIME)\n\nReal Scenario: \"Web app storage 90% full at 2 AM\"\n\n{% stepper %}\n{% step %}\n#### Console: Modify volume\n\n* EC2 \u2192 Volumes \u2192 Select \"webapp-data-vol\"\n* Actions \u2192 Modify Volume\n* New size: 20 GiB\n* Click \"Modify\"\n* Status: optimizing (wait 2-5 mins)\n* Refresh until \"100% Complete\"\n{% endstep %}\n\n{% step %}\n#### Instance (while instance stays running)\n\n* SSH to `demo-instance-1` and run the commands below to expand partition and filesystem online\n{% endstep %}\n{% endstepper %}\n\nInstance Commands (SSH to demo-instance-1):\n\n{% code title=\"Instance commands\" %}\n```bash\n# Install tools (one-time)\nsudo yum install -y cloud-utils-growpart\n\n# Check current state\nlsblk\n\n# Shows: xvdf 20G (disk), xvdf1 10G (partition still old)\n\ndf -h /mnt/webapp-data\n\n# Shows: 9.8G (filesystem still old)\n\n# Step 1: Expand PARTITION\nsudo growpart /dev/xvdf 1\n\n# Verify partition expanded\nlsblk\n\n# Now: xvdf1 20G \u2713\n\n# Step 2: Expand FILESYSTEM (online - no unmount!)\nsudo resize2fs /dev/xvdf1\n\n# Verify final size\ndf -h /mnt/webapp-data\n\n# Now: 19.6G \u2713\n\n# Data still there!\ncat /mnt/webapp-data/test.txt\n```\n{% endcode %}\n\n\u2705 Success: 10GB \u2192 20GB without stopping the instance\n\n***\n\n## EXERCISE 3: New Volume + New Instance (Console)\n\nReal Scenario: \"Deploying new microservice needs storage\"\n\n{% stepper %}\n{% step %}\n#### Console: Create new volume\n\n* Size: 15 GiB | AZ: us-east-1a\n* Name: \"microservice-data-vol\"\n{% endstep %}\n\n{% step %}\n#### Console: Attach to demo-instance-2\n\n* Actions \u2192 Attach volume\n* Instance: `demo-instance-2`\n* Device: `/dev/sdf`\n{% endstep %}\n{% endstepper %}\n\nInstance Commands (SSH to demo-instance-2):\n\n{% code title=\"Instance commands\" %}\n```bash\n# Check new volume\nlsblk\n\n# Shows: xvdf 15G\n\n# Setup exactly like Exercise 1\nsudo mkdir /mnt/microservice-data\nsudo mkfs.ext4 /dev/xvdf\nsudo mount /dev/xvdf /mnt/microservice-data\ndf -h | grep microservice-data\n\n# Test\necho \"Microservice logs\" | sudo tee /mnt/microservice-data/logs.txt\ncat /mnt/microservice-data/logs.txt\n```\n{% endcode %}\n\n\u2705 Success: New instance has new storage ready\n\n***\n\n## EXERCISE 4: Make Volume Permanent (fstab)\n\nReal Scenario: \"Instance rebooted, volume disappeared!\"\n\nInstance Commands (SSH to demo-instance-2):\n\n{% code title=\"Instance commands\" %}\n```bash\n# 1. Get volume UUID (CRITICAL!)\nsudo blkid /dev/xvdf\n\n# Copy: UUID=\"1234abcd-5678-efgh-ijkl-9012mnopqrst\"\n\n# 2. BACKUP fstab (CRITICAL!)\nsudo cp /etc/fstab /etc/fstab.backup\n\n# 3. Add to fstab\nsudo nano /etc/fstab\n\n# Add this line at bottom:\n# UUID=1234abcd-5678-efgh-ijkl-9012mnopqrst /mnt/microservice-data ext4 defaults,nofail 0 0\n\n# 4. TEST before reboot (CRITICAL!)\nsudo mount -a\n\n# No errors = good!\n\n# 5. Verify\nmount | grep microservice-data\n\n# 6. Test reboot\nsudo reboot\n```\n{% endcode %}\n\nAfter reboot (SSH back in):\n\n```bash\ndf -h | grep microservice-data\n\n# Volume auto-mounted! \u2713\n```\n\n***\n\n## EXERCISE 5: Move Volume to Different Instance (Recovery)\n\nReal Scenario: \"demo-instance-2 crashed! Recover data\"\n\nInstance Commands (SSH to demo-instance-2 - BEFORE detach):\n\n{% code title=\"Before detach (on demo-instance-2)\" %}\n```bash\n# Unmount first (CRITICAL!)\nsudo umount /mnt/microservice-data\ndf -h  # Should NOT show it mounted\n```\n{% endcode %}\n\nAWS Console Steps:\n\n{% stepper %}\n{% step %}\n* EC2 \u2192 Volumes \u2192 \"microservice-data-vol\"\n* Actions \u2192 Detach volume\n* Wait: in-use \u2192 available (1-2 mins)\n{% endstep %}\n\n{% step %}\n* Attach to `demo-instance-1`:\n  * Actions \u2192 Attach volume\n  * Instance: `demo-instance-1`\n  * Device: `/dev/sdg` (different device name)\n{% endstep %}\n{% endstepper %}\n\nInstance Commands (SSH to demo-instance-1):\n\n{% code title=\"On demo-instance-1\" %}\n```bash\n# Check new device\nlsblk\n\n# Shows: xvdg 15G (new device name)\n\n# Mount recovered volume\nsudo mkdir /mnt/recovered-data\nsudo mount /dev/xvdg /mnt/recovered-data\n\n# Data is here!\nls -la /mnt/recovered-data/\ncat /mnt/recovered-data/logs.txt\n\n# \"Microservice logs\" \u2713\n```\n{% endcode %}\n\n\u2705 Success: Data recovered on different instance!\n\n***\n\n## EXERCISE 6: Root Volume Expansion (growpart + resize2fs Deep Dive)\n\nReal Scenario: \"Root filesystem 95% full!\"\n\n{% stepper %}\n{% step %}\n#### Console: Modify root volume\n\n* EC2 \u2192 Volumes \u2192 Find root volume of `demo-instance-3`\n* Actions \u2192 Modify Volume \u2192 20 GiB\n* Wait for 100% complete\n{% endstep %}\n\n{% step %}\n#### Instance: expand partition and filesystem on root\n\n* SSH to `demo-instance-3` and follow the commands below\n{% endstep %}\n{% endstepper %}\n\nInstance Commands (SSH to demo-instance-3):\n\n{% code title=\"Instance commands\" %}\n```bash\n# Install tools\nsudo yum install -y cloud-utils-growpart\n\n# BEFORE state\necho \"=== BEFORE ===\"\nlsblk\n\n# xvda 20G (disk), xvda1 8G (partition)\n\ndf -h /\n\n# 7.8G (filesystem)\n\n# Step 1: Expand PARTITION\nsudo growpart /dev/xvda 1\nlsblk\n\n# xvda1 now 20G \u2713\n\n# Step 2: Check filesystem type\ndf -T /\n\n# ext4 \u2713\n\n# Step 3: Expand FILESYSTEM (root = /)\nsudo resize2fs /dev/xvda1\n\n# AFTER state\necho \"=== AFTER ===\"\ndf -h /\n\n# 19.6G \u2713\n\nlsblk\n```\n{% endcode %}\n\n\u2705 Success: Root volume fully expanded!\n\n***\n\n## ONE-PAGE CHEAT SHEET (Print This!)\n\n{% code title=\"Cheat Sheet\" %}\n```\nEBS VOLUME WORKFLOW (Console + Instance)\n\n1\ufe0f\u20e3 CREATE \u2192 Console: Volumes \u2192 Create Volume \u2192 Attach\n2\ufe0f\u20e3 FORMAT \u2192 sudo mkfs.ext4 /dev/xvdf\n3\ufe0f\u20e3 MOUNT \u2192 sudo mount /dev/xvdf /mnt/data\n4\ufe0f\u20e3 FSTAB \u2192 sudo blkid \u2192 nano /etc/fstab \u2192 sudo mount -a\n5\ufe0f\u20e3 RESIZE\u2192 Console: Modify Volume \u2192 growpart \u2192 resize2fs\n6\ufe0f\u20e3 RECOVER\u2192 Console: Detach \u2192 Attach new \u2192 mount /dev/xvdX\n\nEXT4 COMMANDS:\n\u251c\u2500 Partition: sudo growpart /dev/xvdf 1\n\u251c\u2500 Filesystem: sudo resize2fs /dev/xvdf1  \n\u2514\u2500 Check: df -h\n\nXFS COMMANDS:\n\u251c\u2500 Partition: sudo growpart /dev/xvdf 1\n\u2514\u2500 Filesystem: sudo xfs_growfs /mnt/data\n\nCRITICAL CHECKS:\n\u251c\u2500 lsblk (see devices)\n\u251c\u2500 df -h (see mounted space)  \n\u251c\u2500 df -T (see filesystem type)\n\u2514\u2500 sudo mount -a (test fstab)\n```\n{% endcode %}\n\n***\n\n## TEACHING FLOW (70 minutes total)\n\n| Time  | Exercise         | Console         | Instance Commands |\n| ----- | ---------------- | --------------- | ----------------- |\n| 0-10  | 1: Create+Attach | \u2705 3 clicks      | 6 commands        |\n| 10-25 | 2: Resize Live   | \u2705 Modify        | 8 commands        |\n| 25-37 | 3: New Volume    | \u2705 3 clicks      | 6 commands        |\n| 37-45 | 4: fstab         | -               | 8 commands        |\n| 45-55 | 5: Recovery      | \u2705 Detach/Attach | 5 commands        |\n| 55-67 | 6: Root Expand   | \u2705 Modify        | 8 commands        |\n| 67-70 | Q\\&A             | -               | -                 |\n\n***\n\n## STUDENT ASSESSMENT QUESTIONS (End of Demo)\n\n<details>\n\n<summary>Console: How do you resize a volume?</summary>\n\nAnswer: Modify Volume\n\n</details>\n\n<details>\n\n<summary>What's /dev/xvdf vs /dev/xvdf1?</summary>\n\nAnswer: Device vs Partition\n\n</details>\n\n<details>\n\n<summary>Why run sudo mount -a before reboot?</summary>\n\nAnswer: Test fstab\n\n</details>\n\n<details>\n\n<summary>Instance crashed - 4 steps to recover data?</summary>\n\nAnswer: Unmount \u2192 Detach \u2192 Attach \u2192 Mount\n\n</details>\n\n<details>\n\n<summary>ext4 vs XFS command?</summary>\n\nAnswer: ext4 uses resize2fs; XFS uses xfs\\_growfs\n\n</details>\n\nAll 5 correct = Production Ready! \ud83c\udf93\n\n***\n\nEverything in this guide is AWS Console + simple EC2 instance commands. No AWS CLI needed. Print the One-Page Cheat Sheet for students. Ready for your live demo! \ud83d\ude80\n", "ebs-volumes-demo-guide.md": "# ebs volumes demo guide\n\n## Prerequisites\n\n* AWS Account with appropriate IAM permissions\n* 2-3 EC2 instances running (Linux/Ubuntu or Amazon Linux)\n* SSH access to EC2 instances\n* AWS CLI configured or AWS Console access\n* Basic Linux command knowledge\n\n***\n\n## Exercise 1: Create a New Volume and Attach to EC2 Instance\n\nReal-Time Scenario: \"Your application needs additional storage. You need to create a 10GB EBS volume and attach it to a running EC2 instance.\"\n\n{% stepper %}\n{% step %}\n### Create an EBS Volume using AWS CLI\n\n```bash\n# First, find your instance's availability zone\naws ec2 describe-instances --instance-ids i-0123456789abcdef0 \\\n  --query 'Reservations[0].Instances[0].Placement.AvailabilityZone' \\\n  --output text\n\n# Example output: us-east-1a\n\n# Create a new EBS volume (gp3)\naws ec2 create-volume \\\n  --size 10 \\\n  --volume-type gp3 \\\n  --availability-zone us-east-1a \\\n  --tag-specifications 'ResourceType=volume,Tags=[{Key=Name,Value=demo-volume-1}]'\n```\n\nCapture the VolumeId from the output for next steps.\n{% endstep %}\n\n{% step %}\n### Verify Volume Status\n\n```bash\naws ec2 describe-volumes --volume-ids vol-0abcdef1234567890 \\\n  --query 'Volumes[0].[VolumeId,State,Size,AvailabilityZone]' \\\n  --output table\n```\n\nKeep checking until State shows \"available\".\n{% endstep %}\n\n{% step %}\n### Attach Volume to EC2 Instance\n\n```bash\naws ec2 attach-volume \\\n  --volume-id vol-0abcdef1234567890 \\\n  --instance-id i-0123456789abcdef0 \\\n  --device /dev/sdf\n```\n\nNote device naming conventions: /dev/sdf (or /dev/xvdf on the instance).\n{% endstep %}\n\n{% step %}\n### Connect to EC2 Instance and Mount the Volume\n\n```bash\n# SSH into the instance\nssh -i your-key.pem ec2-user@your-instance-ip\n\n# List attached disks\nlsblk\n\n# Check device\nsudo fdisk -l /dev/xvdf\n\n# Create mount point\nsudo mkdir -p /mnt/data-volume\n\n# Create ext4 filesystem (or xfs)\nsudo mkfs.ext4 /dev/xvdf\n\n# Mount\nsudo mount /dev/xvdf /mnt/data-volume\n\n# Verify\ndf -h | grep data-volume\n\n# Test file\nsudo touch /mnt/data-volume/test-file.txt\nls -la /mnt/data-volume/\n```\n\nKey teaching points: device naming, same AZ requirement, filesystem creation, mount point creation.\n{% endstep %}\n{% endstepper %}\n\n***\n\n## Exercise 2: Increase Volume Size Without Downtime\n\nReal-Time Scenario: \"Increase volume from 10GB to 20GB while the application remains running.\"\n\n{% stepper %}\n{% step %}\n### Take a Snapshot (Best Practice)\n\n```bash\naws ec2 create-snapshot \\\n  --volume-id vol-0abcdef1234567890 \\\n  --description \"Backup before resize - $(date +%Y-%m-%d)\"\n```\n\nCapture the SnapshotId for records.\n{% endstep %}\n\n{% step %}\n### Modify the Volume Size in AWS (Console or CLI)\n\n```bash\n# Check current state\naws ec2 describe-volumes --volume-ids vol-0abcdef1234567890 \\\n  --query 'Volumes[0].[VolumeId,Size,State]'\n\n# Modify size\naws ec2 modify-volume --volume-id vol-0abcdef1234567890 --size 20\n```\n\nMonitor the asynchronous modification.\n{% endstep %}\n\n{% step %}\n### Monitor the Modification Progress\n\n```bash\naws ec2 describe-volumes-modifications \\\n  --volume-ids vol-0abcdef1234567890 \\\n  --query 'VolumesModifications[0].[VolumeId,ModificationState,Progress]'\n```\n\nWait until ModificationState is \"completed\" (or optimizing/100).\n{% endstep %}\n\n{% step %}\n### On the Instance: Extend Partition (if partition exists) using growpart\n\n```bash\n# Install tool if needed\nsudo apt-get update && sudo apt-get install -y cloud-guest-utils\n# or for RHEL/CentOS:\n# sudo yum install -y cloud-utils-growpart\n\n# Identify partition layout\nsudo lsblk -o NAME,SIZE,TYPE\n\n# Grow partition (format: growpart <device> <partition-number>)\nsudo growpart /dev/xvdf 1\n\n# Verify\nsudo lsblk\n```\n\nIf device has no partition (raw device), skip growpart and go directly to filesystem resize.\n{% endstep %}\n\n{% step %}\n### Extend the Filesystem\n\nFor ext4:\n\n```bash\n# Check filesystem type\ndf -T | grep data-volume\n\n# Resize (online)\nsudo resize2fs /dev/xvdf1\n```\n\nFor XFS:\n\n```bash\n# Resize (must be mounted; use mount point)\nsudo xfs_growfs /mnt/data-volume\n# or\nsudo xfs_growfs -d /mnt/data-volume\n```\n\nVerify with: df -h | grep data-volume\n{% endstep %}\n{% endstepper %}\n\nKey teaching points: asynchronous volume modification, no downtime, partition expansion with growpart, filesystem expansion commands.\n\n***\n\n## Exercise 3: Create a New Volume and Attach to New Instance\n\nReal-Time Scenario: \"You've deployed a new microservice on a new EC2 instance. It needs persistent storage.\"\n\n{% stepper %}\n{% step %}\n### Launch a New EC2 Instance\n\n```bash\naws ec2 run-instances \\\n  --image-id ami-0c55b159cbfafe1f0 \\\n  --instance-type t2.micro \\\n  --key-name your-key-pair \\\n  --security-groups default \\\n  --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=new-instance}]'\n```\n\nCapture the InstanceId and wait until running.\n{% endstep %}\n\n{% step %}\n### Create a New Volume in Same AZ\n\n```bash\naws ec2 describe-instances --instance-ids i-0987654321abcdef0 \\\n  --query 'Reservations[0].Instances[0].Placement.AvailabilityZone'\n\naws ec2 create-volume \\\n  --size 15 \\\n  --volume-type gp3 \\\n  --availability-zone us-east-1a \\\n  --tag-specifications 'ResourceType=volume,Tags=[{Key=Name,Value=demo-volume-new-instance}]'\n```\n\nCapture the VolumeId.\n{% endstep %}\n\n{% step %}\n### Attach Volume to New Instance\n\n```bash\naws ec2 attach-volume \\\n  --volume-id vol-abcd1234efgh5678 \\\n  --instance-id i-0987654321abcdef0 \\\n  --device /dev/sdf\n\n# Verify\naws ec2 describe-volumes --volume-ids vol-abcd1234efgh5678 \\\n  --query 'Volumes[0].[VolumeId,Attachments[0].InstanceId,State]'\n```\n{% endstep %}\n\n{% step %}\n### Mount the Volume on New Instance\n\n```bash\nssh -i your-key.pem ec2-user@new-instance-ip\n\n# List disks\nlsblk\n\n# Create filesystem and mount\nsudo mkfs.ext4 /dev/xvdf\nsudo mkdir -p /mnt/application-data\nsudo mount /dev/xvdf /mnt/application-data\n\n# Verify and test\ndf -h | grep application-data\nsudo bash -c 'echo \"App data on new instance\" > /mnt/application-data/app-info.txt'\ncat /mnt/application-data/app-info.txt\n```\n{% endstep %}\n{% endstepper %}\n\nKey teaching points: same AZ requirement, device naming, preparing fresh instances.\n\n***\n\n## Exercise 4: Add Volume to fstab for Permanent Mount\n\nReal-Time Scenario: \"Ensure the attached volume auto-mounts after reboot.\"\n\n{% stepper %}\n{% step %}\n### Get Volume UUID\n\n```bash\nsudo blkid /dev/xvdf\n# Example output:\n# /dev/xvdf1: UUID=\"a1b2c3d4-e5f6-7890-abcd-ef1234567890\" TYPE=\"ext4\" PARTUUID=\"12345678\"\n```\n\nCapture the UUID.\n{% endstep %}\n\n{% step %}\n### Backup fstab (Critical)\n\n```bash\nsudo cp /etc/fstab /etc/fstab.backup\ncat /etc/fstab.backup\n```\n{% endstep %}\n\n{% step %}\n### Add Entry to fstab\n\nFormat: UUID=\n\n```bash\necho \"UUID=a1b2c3d4-e5f6-7890-abcd-ef1234567890 /mnt/data-volume ext4 defaults,nofail 0 0\" | sudo tee -a /etc/fstab\n# Or edit with sudo nano /etc/fstab\n```\n\nFor XFS, replace ext4 with xfs.\n{% endstep %}\n\n{% step %}\n### Test fstab Configuration\n\n```bash\nsudo mount -a\n# If no errors, fstab is valid\ndf -h | grep data-volume\nmount | grep data-volume\n```\n\nThen reboot to verify persistence:\n\n```bash\nsudo reboot\n# After reboot: ssh back and verify\ndf -h\nmount | grep data-volume\n```\n{% endstep %}\n{% endstepper %}\n\nKey teaching points: UUID vs device name, nofail option, always test mount -a before reboot, backup fstab.\n\n***\n\n## Exercise 5: Unmount a Volume and Attach to Another Instance\n\nReal-Time Scenario: \"Recover data by detaching an EBS volume from a crashed instance and attaching to a rescue instance.\"\n\n{% stepper %}\n{% step %}\n### Unmount the Volume from Current Instance\n\n```bash\nsudo umount /mnt/data-volume\n# Verify\ndf -h\nsudo lsblk\n```\n{% endstep %}\n\n{% step %}\n### Detach Volume via AWS CLI\n\n```bash\n# Optionally find instance IP\naws ec2 describe-instances --instance-ids i-0123456789abcdef0 \\\n  --query 'Reservations[0].Instances[0].PublicIpAddress'\n\n# Detach\naws ec2 detach-volume --volume-id vol-0abcdef1234567890\n\n# Monitor\naws ec2 describe-volumes --volume-ids vol-0abcdef1234567890 \\\n  --query 'Volumes[0].[VolumeId,State,Attachments]'\n```\n\nStatus will transition: in-use \u2192 detaching \u2192 available.\n{% endstep %}\n\n{% step %}\n### Attach Volume to Another Instance\n\n```bash\n# Find target instance in same AZ\naws ec2 describe-instances \\\n  --filters 'Name=instance-state-name,Values=running' \\\n  --query 'Reservations[].Instances[].[InstanceId,PublicIpAddress,Placement.AvailabilityZone]'\n\n# Attach\naws ec2 attach-volume \\\n  --volume-id vol-0abcdef1234567890 \\\n  --instance-id i-0987654321abcdef0 \\\n  --device /dev/sdf\n```\n{% endstep %}\n\n{% step %}\n### Mount Volume on Rescue Instance and Access Data\n\n```bash\nssh -i your-key.pem ec2-user@rescue-instance-ip\nlsblk\n\n# Optional filesystem check (read-only)\nsudo fsck.ext4 -n /dev/xvdf1\n\nsudo mkdir -p /mnt/recovered-data\nsudo mount /dev/xvdf /mnt/recovered-data\n\nls -la /mnt/recovered-data/\ncat /mnt/recovered-data/test-file.txt\n```\n{% endstep %}\n\n{% step %}\n### (Optional) Reattach to Original Instance\n\n```bash\n# Unmount from rescue\nsudo umount /mnt/recovered-data\n\n# Detach\naws ec2 detach-volume --volume-id vol-0abcdef1234567890\n\n# Reattach\naws ec2 attach-volume \\\n  --volume-id vol-0abcdef1234567890 \\\n  --instance-id i-0123456789abcdef0 \\\n  --device /dev/sdf\n\n# Mount\nssh -i your-key.pem ec2-user@original-instance-ip\nsudo mount /dev/xvdf /mnt/data-volume\n```\n{% endstep %}\n{% endstepper %}\n\nKey teaching points: always unmount before detaching, same AZ requirement, check filesystem before remount.\n\n***\n\n## Exercise 6: growpart, growfs, and resize2fs Deep Dive\n\nReal-Time Scenario: \"Root volume nearly full. Volume increased in AWS. Expand partition and filesystem without data loss.\"\n\n{% stepper %}\n{% step %}\n### Check Current Partition and Filesystem State\n\n```bash\nlsblk\ndf -h\ndf -T /\n```\n\nIdentify whether disk shows larger size than partition (e.g., disk 20G, partition 8G).\n{% endstep %}\n\n{% step %}\n### Install cloud-utils (growpart)\n\n```bash\n# Ubuntu/Debian\nsudo apt-get update\nsudo apt-get install -y cloud-guest-utils\n\n# CentOS/RHEL\nsudo yum install -y cloud-utils-growpart\n\nwhich growpart\ngrowpart --version\n```\n{% endstep %}\n\n{% step %}\n### Use growpart to Expand Partition\n\n```bash\nsudo growpart /dev/xvda 1\nlsblk\n```\n\nIf growpart fails on GPT, use parted:\n\n```bash\nsudo parted /dev/xvda resizepart 1 20G\nlsblk\n```\n{% endstep %}\n\n{% step %}\n### Resize ext4 Filesystem with resize2fs\n\n```bash\n# Confirm ext4\ndf -T / | grep ext4\n\n# Online resize\nsudo resize2fs /dev/xvda1\n\n# Optional: specify size\n# sudo resize2fs /dev/xvda1 15G\n```\n\nVerify: df -h /\n{% endstep %}\n\n{% step %}\n### Expand XFS Filesystem with xfs\\_growfs\n\n```bash\n# Confirm xfs\ndf -T / | grep xfs\n\n# Expand to maximum (mounted)\nsudo xfs_growfs /\n\n# Or expand a specific mount:\nsudo xfs_growfs /mnt/data-volume\n```\n\nVerify: df -h /\n{% endstep %}\n\n{% step %}\n### Complete Workflow Example\n\n```bash\n# Volume increased in AWS\n\nssh -i key.pem ec2-user@instance-ip\n\nlsblk\ndf -h /\ndf -T /\n\nsudo apt-get update && sudo apt-get install -y cloud-guest-utils\n\nsudo growpart /dev/xvda 1\nlsblk\n\n# For ext4:\nsudo resize2fs /dev/xvda1\n\n# OR for XFS:\nsudo xfs_growfs /\n\ndf -h /\nlsblk\n```\n{% endstep %}\n{% endstepper %}\n\nComparison summary:\n\n| Tool        | Purpose                | Filesystem | Online | Target              |\n| ----------- | ---------------------- | ---------- | ------ | ------------------- |\n| growpart    | Expand partition       | Any        | Yes    | Device (/dev/xvda1) |\n| resize2fs   | Expand ext4 filesystem | ext4       | Yes    | Device              |\n| xfs\\_growfs | Expand xfs filesystem  | xfs        | Yes    | Mount point         |\n\nKey teaching points: three-layer expansion (AWS volume \u2192 partition \u2192 filesystem), order matters, online operations possible.\n\n***\n\n## Quick Reference Commands Summary\n\n```bash\n# CREATE & ATTACH\naws ec2 create-volume --size 10 --volume-type gp3 --availability-zone us-east-1a\naws ec2 attach-volume --volume-id vol-xxx --instance-id i-xxx --device /dev/sdf\naws ec2 describe-volumes --volume-ids vol-xxx\n\n# FILESYSTEM SETUP\nlsblk\nsudo mkfs.ext4 /dev/xvdf        # ext4\nsudo mkfs.xfs /dev/xvdf         # xfs\nsudo mount /dev/xvdf /mnt/volume\ndf -h\n\n# FSTAB\nsudo blkid /dev/xvdf\nsudo cp /etc/fstab /etc/fstab.backup\necho \"UUID=xxx /mnt/volume ext4 defaults,nofail 0 0\" | sudo tee -a /etc/fstab\nsudo mount -a\n\n# VOLUME RESIZING\naws ec2 modify-volume --volume-id vol-xxx --size 20\naws ec2 describe-volumes-modifications --volume-ids vol-xxx\nssh -i key.pem ec2-user@instance-ip\nsudo growpart /dev/xvda 1\nsudo resize2fs /dev/xvda1        # ext4\nsudo xfs_growfs /                # xfs\ndf -h\nlsblk\n\n# DETACH & REATTACH\nsudo umount /mnt/volume\naws ec2 detach-volume --volume-id vol-xxx\naws ec2 attach-volume --volume-id vol-xxx --instance-id i-yyy --device /dev/sdf\nsudo mount /dev/xvdf /mnt/recovered\n```\n\n***\n\n## Common Troubleshooting Scenarios\n\n<details>\n\n<summary>Issue 1: growpart: NOCHANGE</summary>\n\nProblem: sudo growpart /dev/xvda 1 Output: NOCHANGE: partition 1 is size 20971520. it cannot be grown\n\nSolution:\n\n* Volume modification may still be in progress.\n* Check: aws ec2 describe-volumes-modifications --volume-ids vol-xxx\n* Wait until modification state is \"completed\".\n\n</details>\n\n<details>\n\n<summary>Issue 2: resize2fs: Device or resource busy</summary>\n\nProblem: sudo resize2fs /dev/xvda1 Output: Device or resource busy while trying to open /dev/xvda1\n\nSolution:\n\n* Volume might be detaching or busy. Check lsblk for device status.\n* Wait a few seconds and retry.\n\n</details>\n\n<details>\n\n<summary>Issue 3: fstab Entry Causes Boot Failure</summary>\n\nProblem: Instance fails to boot after fstab modification.\n\nSolution:\n\n* Recovery steps:\n  1. Stop the instance.\n  2. Detach root volume.\n  3. Attach to another instance.\n  4. Mount and fix /etc/fstab.\n  5. Reattach and restart.\n\n</details>\n\n<details>\n\n<summary>Issue 4: Partition Not Showing Full Size</summary>\n\nProblem: lsblk shows disk 20G but partition xvdf1 is 8G.\n\nSolution:\n\n* Run growpart: sudo growpart /dev/xvdf 1\n* Verify with lsblk.\n\n</details>\n\n<details>\n\n<summary>Issue 5: XFS Filesystem Shows Old Size</summary>\n\nProblem: df -h shows 8G even after resize.\n\nSolution:\n\n* Ensure XFS is mounted and run: sudo xfs\\_growfs / (or sudo xfs\\_growfs /mnt/data-volume)\n* Verify with df -h /\n\n</details>\n\n***\n\n## Best Practices for Students\n\n1. Always backup: snapshot before resizing; backup /etc/fstab before editing.\n2. Same Availability Zone: volume and instance must be in the same AZ.\n3. Test fstab before rebooting: sudo mount -a.\n4. Know your filesystem type: df -T; use resize2fs for ext4, xfs\\_growfs for xfs.\n5. Document volumes using tags and notes.\n6. Monitor asynchronous processes: check volume modification status.\n7. Verify after each step: lsblk after attachment, df -h after mount/resize.\n\n***\n\n## Lab Cleanup\n\n```bash\n# Unmount\nsudo umount /mnt/data-volume\n\n# Detach volume\naws ec2 detach-volume --volume-id vol-xxx\n\n# Delete volume\naws ec2 delete-volume --volume-id vol-xxx\n\n# Terminate instance\naws ec2 terminate-instances --instance-ids i-xxx\n\n# Delete snapshots\naws ec2 delete-snapshot --snapshot-id snap-xxx\n```\n\n***\n\n\n"};
        
        const tabsContainer = document.getElementById('tabs');
        const contentContainer = document.getElementById('content');
        
        let activeTab = null;
        
        // Configure marked to use syntax highlighting
        marked.setOptions({
            highlight: function(code, lang) {
                if (Prism.languages[lang]) {
                    return Prism.highlight(code, Prism.languages[lang], lang);
                } else {
                    return code;
                }
            }
        });
        
        const filenames = Object.keys(markdownData).sort();
        
        filenames.forEach(filename => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn text-left px-5 py-4 rounded-xl transition-all duration-200';
            
            let label = filename.replace('.md', '').replace(/-/g, ' ');
            label = label.charAt(0).toUpperCase() + label.slice(1);
            btn.innerHTML = `<div class="font-medium">${label}</div><div class="text-xs text-gray-500 mt-1">${filename}</div>`;
            
            btn.onclick = () => {
                if (activeTab) activeTab.classList.remove('active');
                btn.classList.add('active');
                activeTab = btn;
                
                let mdContent = markdownData[filename];
                mdContent = mdContent.replace(/{% stepper %}/g, '<div class="pl-4 border-l-2 border-indigo-500 my-4">');
                mdContent = mdContent.replace(/{% endstepper %}/g, '</div>');
                mdContent = mdContent.replace(/{% step %}/g, '<div class="mb-8">');
                mdContent = mdContent.replace(/{% endstep %}/g, '</div>');
                
                contentContainer.innerHTML = marked.parse(mdContent);
            };
            
            tabsContainer.appendChild(btn);
        });
