<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Interview Prep Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .topic-tab.active { background-color: #38bdf8; color: #0f172a; font-weight: bold; }
        .category-header { background: linear-gradient(90deg, #1e293b, #0f172a); border-left: 4px solid #38bdf8; }
        .question-card { background-color: #1e293b; border: 1px solid #334155; transition: all 0.2s; }
        .question-card:hover { border-color: #38bdf8; }
        .answer-text { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #334155; color: #cbd5e1; line-height: 1.6; }
        .question-card.open .answer-text { display: block; }
        .question-card.open .chevron { transform: rotate(180deg); }
        .answer-text code { background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #38bdf8; font-family: monospace;}
        .answer-text ul { list-style-type: disc; margin-left: 1.5rem; margin-top: 0.5rem; }
        .answer-text li { margin-bottom: 0.25rem; }
    </style>
    <!-- Base Data (Contains old short answers) -->
    <script src="interview_data.js"></script>
    <!-- Phase 1 & 2: Expanded Detailed Data -->
    <script>window.interviewData = interviewData || {};</script>
    <script src="data_shell.js"></script>
    <script src="data_git.js"></script>
    <script src="data_jenkins.js"></script>
    <script src="data_aws.js"></script>
    <!-- AWS Sub-topics: LB Basics, ELB, S3, IAM, ASG -->
    <script src="data_aws_subtopics.js"></script>
</head>
<body class="p-4 md:p-8">

    <header class="text-center mb-10">
        <h1 class="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-4">DevOps Interview Mastery</h1>
        <p class="text-gray-400 text-lg">Comprehensive Q&A for Shell Scripting, Git, Jenkins, AWS &amp; AWS Deep Dives</p>
        <p class="text-sm text-cyan-400 mt-2">310+ Questions | AWS Sub-topics: Load Balancer, ELB, S3, IAM, ASG (30 Qs each)</p>
    </header>

    <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-8">
        
        <!-- Sidebar Navigation -->
        <div class="w-full md:w-1/4 flex flex-col gap-2" id="tabs-container">
            <!-- Tabs injected by JS -->
        </div>

        <!-- Main Content -->
        <div class="w-full md:w-3/4" id="content-container">
            <div class="text-center py-20 text-gray-500">
                <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <h2 class="text-2xl font-semibold">Select a topic to start</h2>
            </div>
        </div>

    </div>

    <script>
        // Check if data loaded
        if (typeof interviewData === 'undefined') {
            document.getElementById('content-container').innerHTML = '<div class="text-red-500 text-center py-10">Error: Could not load data files. Ensure all js files are in the same directory.</div>';
        } else {
            const tabsContainer = document.getElementById('tabs-container');
            const contentContainer = document.getElementById('content-container');

            let activeTopic = null;

            // --- Group topics: detect parent ▶ sub-topic structure ---
            const allTopics = Object.keys(interviewData);
            const topicGroups = {}; // parentName -> [ { key, label } ]
            const standaloneTopics = []; // topics without ▶

            allTopics.forEach(key => {
                if (key.includes('▶')) {
                    const parts = key.split('▶').map(s => s.trim());
                    const parent = parts[0];
                    const child = parts.slice(1).join('▶').trim();
                    if (!topicGroups[parent]) topicGroups[parent] = [];
                    topicGroups[parent].push({ key, label: child });
                } else {
                    standaloneTopics.push(key);
                }
            });

            // Render: standalone topics first, then groups
            let firstBtn = null;

            function addTopicBtn(topic, displayLabel, indent) {
                const totalQs = Object.values(interviewData[topic]).reduce((sum, arr) => sum + arr.length, 0);
                const btn = document.createElement('button');
                const indentClass = indent ? 'pl-8 border-l-2 border-cyan-800 rounded-r-xl ml-2' : 'rounded-xl';
                btn.className = `topic-tab text-left px-5 py-3 bg-slate-800 text-gray-300 hover:bg-slate-700 transition-all border border-slate-700 ${indentClass}`;
                btn.innerHTML = indent
                    ? `<span class="text-sm font-semibold text-cyan-300">↳ ${displayLabel}</span><br><span class="text-xs text-gray-400">${totalQs} Questions</span>`
                    : `<span class="text-base font-semibold">${displayLabel}</span><br><span class="text-xs text-gray-400">${totalQs} Questions</span>`;

                btn.onclick = () => {
                    if (activeTopic) activeTopic.classList.remove('active');
                    btn.classList.add('active');
                    activeTopic = btn;
                    renderContent(topic);
                };
                tabsContainer.appendChild(btn);
                if (!firstBtn) firstBtn = btn;
            }

            // Add standalone topics
            standaloneTopics.forEach(topic => addTopicBtn(topic, topic, false));

            // Add grouped topics with a section header
            Object.entries(topicGroups).forEach(([parent, children]) => {
                // Parent header (non-clickable section divider)
                const header = document.createElement('div');
                header.className = 'text-xs font-bold uppercase tracking-widest text-cyan-500 px-3 pt-4 pb-1';
                header.textContent = `${parent} ▶ Deep Dives`;
                tabsContainer.appendChild(header);
                // Child buttons
                children.forEach(({ key, label }) => addTopicBtn(key, label, true));
            });

            // Auto-open first tab
            if (firstBtn) firstBtn.click();

            function renderContent(topic) {
                const data = interviewData[topic];
                let html = `<div class="mb-8"><h2 class="text-4xl font-bold text-white mb-2">${topic} Interview Questions</h2><p class="text-gray-400">Click on a question to reveal the detailed answer.</p></div>`;

                Object.keys(data).forEach(category => {
                    html += `
                        <div class="mb-10">
                            <h3 class="text-2xl font-semibold text-cyan-400 mb-6 p-4 category-header rounded-r-lg shadow-lg flex items-center justify-between">
                                ${category} Questions
                                <span class="text-sm bg-slate-800 px-3 py-1 rounded-full text-gray-300">${data[category].length} Qs</span>
                            </h3>
                            <div class="flex flex-col gap-4">
                    `;

                    data[category].forEach((item, index) => {
                        // Dynamically highlight backticks as code, but skip if the string already contains HTML tags (like <strong>) to avoid breaking raw formatting.
                        let formattedAnswer = item.a;
                        if (!formattedAnswer.includes("<strong>")) {
                            formattedAnswer = formattedAnswer.replace(/\`([^\`]+)\`/g, '<code>$1</code>');
                        }

                        html += `
                            <div class="question-card rounded-xl p-5 cursor-pointer" onclick="this.classList.toggle('open')">
                                <div class="flex justify-between items-start gap-4">
                                    <div class="text-lg font-medium text-white flex-1"><span class="text-cyan-500 font-bold mr-2">Q${index + 1}.</span> ${item.q}</div>
                                    <svg class="chevron w-6 h-6 text-gray-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                                <div class="answer-text">
                                    ${formattedAnswer}
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                });

                contentContainer.innerHTML = html;
            }
        }
    </script>
</body>
</html>
